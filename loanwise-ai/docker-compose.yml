version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loanwise
      POSTGRES_USER: loanwise_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword_change_me}
    ports:
      - "5432:5432"
    volumes:
      - loanwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanwise_owner -d loanwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://loanwise_owner:${POSTGRES_PASSWORD:-devpassword_change_me}@db:5432/loanwise
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env before running in anything but local dev}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  loanwise_pgdata:
